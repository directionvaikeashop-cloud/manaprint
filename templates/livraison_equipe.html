<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b66">
<title>Livraison numérique · Équipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--lagon:#0f6b66;--lagon-f:#0a4a47;--lagon-c:#e3f1ef;--corail:#e0533d;--sable:#f6f3ec;--papier:#fff;--fg:#14211f;--muted:#5b6b68;--ligne:#dde4e2;
--ok:#2e7d32;--ok-c:#e6f4e7;--non:#c62828;--non-c:#fdecea;--att:#b26a00;--att-c:#fff4e0;--bat:#1e63c8;--bat-c:#e7effb;
--display:"Sora",system-ui,sans-serif;--text:"Inter",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--sable);color:var(--fg);font:15px/1.45 var(--text);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 90px max(16px,env(safe-area-inset-right))}
header{position:sticky;top:0;z-index:20;background:var(--lagon);color:#fff;padding-top:env(safe-area-inset-top)}
header .wrap{padding-bottom:0;display:flex;align-items:center;gap:12px;min-height:60px}
.logo{font:800 18px/1.1 var(--display);letter-spacing:-.01em;white-space:nowrap;min-width:0}
.logo small{display:block;font:600 11px var(--text);letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-top:3px}
header .sp{flex:1}
.ib{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;height:40px;min-width:40px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;white-space:nowrap;flex:none}
.ib.plein{background:#fff;color:var(--lagon)}
.onglets{display:flex;gap:8px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglet{flex:none;border:1px solid var(--ligne);background:var(--papier);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.onglet b{font-variant-numeric:tabular-nums;background:var(--lagon-c);color:var(--lagon-f);border-radius:999px;padding:0 8px;font-size:13px}
.onglet[aria-pressed="true"]{background:var(--lagon-f);color:#fff;border-color:var(--lagon-f)}
.onglet[aria-pressed="true"] b{background:rgba(255,255,255,.2);color:#fff}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.carte{background:var(--papier);border:1px solid var(--ligne);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.carte:hover{border-color:var(--lagon)}
.c-haut{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.c-nom{font:700 17px var(--display)}
.c-ref{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.s-recue{background:var(--att-c);color:var(--att)}.s-preparation{background:var(--att-c);color:var(--att)}
.s-preparee{background:var(--ok-c);color:var(--ok)}.s-bateau{background:var(--bat-c);color:var(--bat)}.s-livree{background:#eceff1;color:#455a64}
.c-info{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.barre{height:8px;border-radius:99px;background:#eef2f1;overflow:hidden;display:flex}
.barre i{display:block;height:100%}
.barre .o{background:var(--ok)}.barre .n{background:var(--non)}
.vide{text-align:center;color:var(--muted);padding:50px 10px}
.vide b{display:block;font:700 18px var(--display);color:var(--fg);margin-bottom:6px}
/* feuille de détail */
.voile{position:fixed;inset:0;background:rgba(5,25,23,.5);z-index:40;display:none}
.feuille{position:fixed;z-index:41;inset:auto 0 0 0;max-height:94vh;background:var(--sable);border-radius:20px 20px 0 0;overflow:auto;display:none;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:900px){.feuille{inset:0 0 0 auto;width:600px;max-height:none;border-radius:0}}
.ouvert .voile,.ouvert .feuille{display:block}
.f-tete{position:sticky;top:0;background:var(--papier);border-bottom:1px solid var(--ligne);padding:14px 16px;display:flex;gap:10px;align-items:center;z-index:2}
.f-tete h2{font:800 20px var(--display);margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fermer{border:1px solid var(--ligne);background:var(--sable);border-radius:999px;width:40px;height:40px;font-size:20px;line-height:1}
.f-corps{padding:16px;display:flex;flex-direction:column;gap:14px}
.bloc{background:var(--papier);border:1px solid var(--ligne);border-radius:14px;padding:14px}
.bloc h3{font:700 15px var(--display);margin:0 0 10px;color:var(--lagon-f);display:flex;justify-content:space-between;align-items:center;gap:8px}
.etapes{display:flex;gap:4px}
.etape{flex:1;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.etape i{display:block;height:6px;border-radius:99px;background:#e3e8e7;margin-bottom:6px}
.etape.fait i{background:var(--lagon)}.etape.fait{color:var(--lagon-f)}
.infos{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.infos dt{color:var(--muted)}.infos dd{margin:0;font-weight:600}
.art{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--ligne);align-items:center}
.art:first-of-type{border-top:0}
.qte{font:700 15px var(--display);background:var(--lagon-c);color:var(--lagon-f);border-radius:8px;min-width:38px;text-align:center;padding:4px 6px}
.des{font-weight:600}
.des small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.art .bt{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bt button{border:1.5px solid var(--ligne);background:var(--papier);border-radius:10px;padding:10px 6px;font-weight:700;font-size:14px}
.bt .v[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.bt .r[aria-pressed="true"]{background:var(--non);border-color:var(--non);color:#fff}
.art.ok .des{color:var(--ok)}.art.non .des{color:var(--non)}.art.non .des .nm{text-decoration:line-through}
.motifs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.motifs button{border:1px solid var(--ligne);background:var(--non-c);color:var(--non);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
.gros{width:100%;border:0;border-radius:14px;padding:15px;font:700 16px var(--display);background:var(--lagon);color:#fff}
.gros:disabled{background:#b9c7c5!important;color:#fff;cursor:not-allowed}
.gros.vert{background:var(--ok)}.gros.bleu{background:var(--bat)}.gros.gris{background:#546e7a}
.gros.wa{background:#25d366;color:#073b1c}
.ligne2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.leger{width:100%;border:1px solid var(--ligne);background:var(--papier);border-radius:12px;padding:12px;font-weight:600}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure{margin:0;position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#dfe6e4}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;width:28px;height:28px;background:rgba(0,0,0,.55);color:#fff}
.depot{border:2px dashed var(--bat);border-radius:14px;padding:18px;text-align:center;color:var(--bat);font-weight:700;background:var(--bat-c);display:block}
.depot input{display:none}
.journal{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.journal b{color:var(--fg);font-weight:600}
.bravo{background:linear-gradient(135deg,#0f6b66,#1e8a83);color:#fff;border-radius:16px;padding:18px;text-align:center}
.bravo h4{font:800 22px var(--display);margin:4px 0}
.bravo p{margin:0 0 12px;opacity:.9}
/* formulaires */
label.ch{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.ch input,label.ch textarea{border:1px solid var(--ligne);border-radius:10px;padding:11px;background:var(--papier);font-size:16px;color:var(--fg);font-weight:500}
label.ch textarea{min-height:140px;resize:vertical}
.form{display:grid;gap:12px}
.deux{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
label.ch{min-width:0}label.ch input,label.ch textarea{width:100%}
.connexion{max-width:420px;margin:12vh auto 0;background:var(--papier);border-radius:20px;padding:26px;border:1px solid var(--ligne)}
.connexion h1{font:800 26px var(--display);margin:0 0 4px;color:var(--lagon-f)}
.connexion p{color:var(--muted);margin:0 0 18px}
.err{color:var(--non);font-weight:600;font-size:14px;min-height:20px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:8px;width:min(94vw,440px)}
.toast{background:var(--lagon-f);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;animation:mont .3s ease}
.toast.vert{background:var(--ok)}.toast.bleu{background:var(--bat)}
@keyframes mont{from{transform:translateY(20px);opacity:0}}
.recherche{width:100%;border:1px solid var(--ligne);border-radius:12px;padding:11px 14px;background:var(--papier);font-size:16px;margin-bottom:12px}
:focus-visible{outline:2px solid var(--corail);outline-offset:2px}
.logo{overflow:hidden;text-overflow:ellipsis;flex:1}
header .sp{display:none}
@media(max-width:480px){.logo{font-size:16px}.logo small,.logo .ln{display:none}.ib{padding:0 10px;height:38px;min-width:38px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
{% raw %}
<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ETAPES = [['recue','Reçue'],['preparation','Préparation'],['preparee','Préparée'],['bateau','Au bateau'],['livree','Livrée']];
const ONGLETS = [['afaire','À préparer',['recue','preparation']],['preparee','Préparées',['preparee']],['bateau','Au bateau',['bateau']],['livree','Livrées',['livree']]];
let etat = {moi:'', commandes:[], onglet:'afaire', ouverte:null, telEquipe:'', archives:false, q:'', dernier:0, motifPour:null};

async function api(url, opts={}) {
  const r = await fetch(url, Object.assign({headers:{'Content-Type':'application/json'}, credentials:'same-origin'}, opts));
  let d = {}; try { d = await r.json(); } catch(e) {}
  if (r.status === 403) { etat.moi = ''; rendreConnexion(); throw new Error('connexion'); }
  if (!r.ok || d.ok === false) throw new Error(d.message || 'Le serveur ne répond pas, réessaie.');
  return d;
}
function toast(t, cls='') { const el = document.createElement('div'); el.className = 'toast ' + cls; el.textContent = t; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 5200); }
function wa(numero, texte) { return 'https://wa.me/' + (numero || '') + '?text=' + encodeURIComponent(texte); }
function numWA(tel) { let d = String(tel||'').replace(/\D/g,''); if (d.startsWith('00')) d = d.slice(2); if (d.length === 8) d = '689' + d; return d; }

/* ── connexion ── */
function rendreConnexion() {
  $('#app').innerHTML = `<div class="wrap"><form class="connexion" id="fc">
    <h1>Livraison numérique</h1><p>Espace préparation · 2KEA &amp; Associé</p>
    <div class="form">
      <label class="ch">Ton prénom<input id="cp" autocomplete="given-name" required placeholder="ex. Maeva"></label>
      <label class="ch">Code de l'équipe<input id="cc" autocomplete="off" required></label>
      <div class="err" id="ce"></div>
      <button class="gros" type="submit">Entrer</button>
    </div></form></div>`;
  try { $('#cp').value = localStorage.getItem('liv_prenom') || ''; } catch(e) {}
  $('#fc').onsubmit = async e => {
    e.preventDefault(); $('#ce').textContent = '';
    try {
      const d = await api('/livraison/api/connexion', {method:'POST', body: JSON.stringify({prenom: $('#cp').value, code: $('#cc').value})});
      try { localStorage.setItem('liv_prenom', $('#cp').value); } catch(e) {}
      etat.moi = d.prenom; demarrer();
    } catch(err) { $('#ce').textContent = err.message === 'connexion' ? 'Code incorrect' : err.message; }
  };
}

/* ── tableau ── */
function squelette() {
  $('#app').innerHTML = `<header><div class="wrap">
      <div class="logo">🚚 Livraison<span class="ln"> numérique</span><small>2KEA &amp; Associé · Chez TUKEA</small></div>
      <div class="sp"></div>
      <button class="ib" id="bnotif" title="Notifications">🔔</button>
      <button class="ib" id="breg" title="Réglages">⚙︎</button>
      <button class="ib plein" id="bnew">＋ Nouvelle</button>
    </div></header>
    <main class="wrap">
      <div class="onglets" id="ong"></div>
      <input class="recherche" id="rq" type="search" placeholder="Chercher un client, une île, une référence…">
      <div class="grille" id="grille"></div>
    </main>
    <div id="det"><div class="voile" id="voile"></div><div class="feuille" id="feuille" role="dialog" aria-modal="true"></div></div>`;
  $('#bnew').onclick = nouvelleCommande;
  $('#breg').onclick = reglages;
  $('#bnotif').onclick = activerNotifs;
  $('#voile').onclick = fermer;
  $('#rq').oninput = e => { etat.q = e.target.value.toLowerCase(); rendreListe(); };
  majCloche();
}
function majCloche() { const b = $('#bnotif'); if (!b) return; const ok = 'Notification' in window && Notification.permission === 'granted'; b.textContent = ok ? '🔔' : '🔕'; b.title = ok ? 'Notifications activées' : 'Activer les notifications'; }
async function activerNotifs() {
  if (!('Notification' in window)) { toast("Ce téléphone n'accepte pas les notifications du navigateur. Les annonces s'affichent en bas de l'écran."); return; }
  const p = await Notification.requestPermission(); majCloche();
  toast(p === 'granted' ? 'Notifications activées ✓' : 'Notifications refusées : les annonces resteront en bas de l\'écran.');
}
async function charger() {
  const d = await api('/livraison/api/commandes' + (etat.archives ? '?archives=1' : ''));
  etat.commandes = d.commandes; etat.telEquipe = d.tel_equipe || ''; etat.moi = d.prenom;
  rendreListe();
}
function rendreListe() {
  const ong = $('#ong'); if (!ong) return;
  ong.innerHTML = '';
  ONGLETS.forEach(([k, l, sts]) => {
    const n = etat.commandes.filter(c => sts.includes(c.statut)).length;
    const b = document.createElement('button'); b.className = 'onglet'; b.type = 'button';
    b.setAttribute('aria-pressed', !etat.archives && etat.onglet === k);
    b.innerHTML = esc(l) + ' <b>' + n + '</b>';
    b.onclick = async () => { etat.onglet = k; if (etat.archives) { etat.archives = false; await charger(); } else rendreListe(); };
    ong.appendChild(b);
  });
  const ba = document.createElement('button'); ba.className = 'onglet'; ba.type = 'button'; ba.textContent = '🗄 Archives';
  ba.setAttribute('aria-pressed', etat.archives); ba.onclick = async () => { etat.archives = !etat.archives; await charger(); };
  ong.appendChild(ba);
  const sts = etat.archives ? null : ONGLETS.find(o => o[0] === etat.onglet)[2];
  let liste = etat.commandes.filter(c => !sts || sts.includes(c.statut));
  if (etat.q) liste = liste.filter(c => [c.client, c.ile, c.ref, c.bateau, c.telephone].join(' ').toLowerCase().includes(etat.q));
  const g = $('#grille');
  if (!liste.length) { g.innerHTML = `<div class="vide" style="grid-column:1/-1"><b>Rien ici pour l'instant</b>${etat.onglet === 'afaire' && !etat.archives ? 'Touche « ＋ Commande » pour en créer une.' : ''}</div>`; return; }
  g.innerHTML = '';
  liste.forEach(c => {
    const t = c.nb_total || 1;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'carte';
    b.innerHTML = `<div class="c-haut"><div><div class="c-nom">${esc(c.client)}</div><div class="c-ref">${esc(c.ref)} · créée le ${esc(c.cree_le)}</div></div>
      <span class="chip s-${c.statut}">${esc(c.libelle)}</span></div>
      <div class="c-info">${c.ile ? '<span>📍 ' + esc(c.ile) + '</span>' : ''}${c.bateau ? '<span>🚢 ' + esc(c.bateau) + (c.depart ? ' · ' + esc(c.depart) : '') + '</span>' : ''}${c.nb_photos ? '<span>📷 ' + c.nb_photos + '</span>' : ''}</div>
      <div class="barre" aria-label="${c.nb_ok} validés, ${c.nb_non} non validés sur ${c.nb_total}"><i class="o" style="width:${100*c.nb_ok/t}%"></i><i class="n" style="width:${100*c.nb_non/t}%"></i></div>
      <div class="c-info"><span>✓ ${c.nb_ok}</span><span>✗ ${c.nb_non}</span><span>${c.nb_total - c.nb_ok - c.nb_non} à faire</span></div>`;
    b.onclick = () => ouvrir(c.id);
    g.appendChild(b);
  });
}

/* ── détail ── */
async function ouvrir(id) {
  const d = await api('/livraison/api/commandes/' + id);
  etat.ouverte = d.commande; document.body.classList.add('ouvert'); rendreDetail();
}
function fermer() { document.body.classList.remove('ouvert'); etat.ouverte = null; etat.motifPour = null; charger().catch(()=>{}); }
function rendreDetail(celebrer) {
  const c = etat.ouverte; if (!c) return;
  const idx = ETAPES.findIndex(e => e[0] === c.statut);
  const reste = c.nb_total - c.nb_ok - c.nb_non;
  const f = $('#feuille');
  const waC = c.wa_client;
  const m = c.messages || {};
  let actions = '';
  if (c.statut === 'recue' || c.statut === 'preparation') {
    actions = `<button class="gros vert" id="a-prep" ${reste ? 'disabled' : ''}>${reste ? 'Encore ' + reste + ' article(s) à vérifier' : '✅ Commande préparée'}</button>`;
  } else if (c.statut === 'preparee') {
    actions = (celebrer ? `<div class="bravo"><div style="font-size:34px">🎉</div><h4>Commande prête !</h4><p>Préviens le client et l'équipe en un clic.</p></div>` : '') +
      `<div class="ligne2"><a class="gros wa" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${esc(wa(waC, m.preparee || ''))}">📲 Prévenir le client</a>
       <a class="gros" style="text-align:center;text-decoration:none;background:var(--lagon-f)" target="_blank" rel="noopener" href="${esc(wa(numWA(etat.telEquipe), m.equipe || ''))}">👥 Prévenir l'équipe</a></div>` + mailBloc(c, 'preparee');
  } else if (c.statut === 'bateau') {
    actions = `${mailBloc(c, 'bateau')}<a class="gros wa" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${esc(wa(waC, m.bateau || ''))}">📲 Envoyer les photos du bateau au client</a>
      <button class="gros gris" id="a-livree">📦 Marquer comme livrée</button>`;
  } else if (c.statut === 'livree') {
    actions = `<button class="leger" id="a-arch">${c.archive ? 'Ressortir des archives' : '🗄 Archiver la commande'}</button>`;
  }
  const blocBateau = (c.statut === 'preparee' || c.statut === 'bateau' || c.statut === 'livree') ? `
    <section class="bloc"><h3>🚢 Au bateau <span class="chip s-bateau">${c.photos.length} photo(s)</span></h3>
      <div class="photos">${c.photos.map(p => `<figure><img src="/livraison/photo/${p.id}" alt="Photo du chargement" loading="lazy"><button data-p="${p.id}" aria-label="Retirer la photo">×</button></figure>`).join('')}</div>
      <label class="depot" style="margin-top:10px">📷 Prendre / ajouter des photos du bac ou du conteneur<input id="fph" type="file" accept="image/*" multiple></label>
      ${c.statut === 'preparee' ? `<button class="gros bleu" id="a-bat" style="margin-top:10px" ${c.photos.length ? '' : 'disabled'}>${c.photos.length ? '🚢 Colis déposés au bateau' : 'Ajoute au moins une photo'}</button>` : ''}
    </section>` : '';
  f.innerHTML = `<div class="f-tete"><h2>${esc(c.client)}</h2><button class="fermer" id="ff" aria-label="Fermer">×</button></div>
  <div class="f-corps">
    <div class="etapes">${ETAPES.map((e, i) => `<div class="etape ${i <= idx ? 'fait' : ''}"><i></i>${e[1]}</div>`).join('')}</div>
    ${actions}
    <section class="bloc"><h3>📋 Articles <span class="c-ref">✓ ${c.nb_ok} · ✗ ${c.nb_non} · ${c.nb_total}</span></h3>
      <div id="arts">${c.articles.map(a => `
        <div class="art ${a.etat}">
          <span class="qte">${esc(a.qte)}</span>
          <span class="des"><span class="nm">${esc(a.designation)}</span>${a.etat ? `<small>${a.etat === 'ok' ? '✓ validé' : '✗ non validé' + (a.motif ? ' · ' + esc(a.motif) : '')} par ${esc(a.par)} · ${esc(a.le)}</small>` : ''}</span>
          ${c.statut === 'recue' || c.statut === 'preparation' ? `<div class="bt"><button class="v" data-a="${a.id}" data-e="ok" aria-pressed="${a.etat === 'ok'}">✓ Je valide</button><button class="r" data-a="${a.id}" data-e="non" aria-pressed="${a.etat === 'non'}">✗ Je ne valide pas</button></div>` : ''}
          ${etat.motifPour === a.id ? `<div class="motifs">${['Rupture de stock','Abîmé','Remplacé','Autre'].map(t => `<button data-m="${a.id}">${t}</button>`).join('')}</div>` : ''}
        </div>`).join('')}</div>
      ${c.statut === 'recue' || c.statut === 'preparation' ? `<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600;color:var(--lagon)">＋ Ajouter des articles</summary>
        <div class="form" style="margin-top:8px"><label class="ch">Une ligne par article<textarea id="ajt" placeholder="2 x OHANA 75 · 4 séries"></textarea></label><button class="leger" id="bajt">Ajouter</button></div></details>` : ''}
    </section>
    ${blocBateau}
    <section class="bloc"><h3>👤 Client & envoi <button class="chip" style="border:1px solid var(--ligne);background:var(--sable)" id="bedit">Modifier</button></h3>
      <dl class="infos"><dt>Référence</dt><dd>${esc(c.ref)}</dd><dt>Téléphone</dt><dd>${c.telephone ? `<a href="tel:${esc(c.telephone)}">${esc(c.telephone)}</a>` : '—'}</dd>
      <dt>Email</dt><dd>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '—'}</dd><dt>Île</dt><dd>${esc(c.ile) || '—'}</dd><dt>Bateau</dt><dd>${esc(c.bateau) || '—'}</dd><dt>Départ</dt><dd>${esc(c.depart) || '—'}</dd>
      ${c.notes ? `<dt>Notes</dt><dd>${esc(c.notes)}</dd>` : ''}</dl>
      <div class="ligne2" style="margin-top:12px"><button class="leger" id="bcopie">🔗 Copier le lien client</button><a class="leger" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${esc(c.lien)}">👁 Voir comme le client</a></div>
    </section>
    <section class="bloc"><h3>🕘 Historique</h3><div class="journal">${c.journal.map(j => `<div>${esc(j.le)} · <b>${esc(j.qui)}</b> — ${esc(j.quoi)}</div>`).join('')}</div></section>
    ${c.statut !== 'livree' ? `<button class="leger" id="a-arch">${c.archive ? 'Ressortir des archives' : '🗄 Archiver'}</button>` : ''}
  </div>`;
  $('#ff').onclick = fermer;
  f.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = c.articles.find(x => x.id == b.dataset.a);
    const e = b.dataset.e === a.etat ? '' : b.dataset.e;
    if (e === 'non') { etat.motifPour = a.id; rendreDetail(); return; }
    marquer(a.id, e, '');
  });
  f.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    let motif = b.textContent;
    if (motif === 'Autre') { motif = prompt('Pourquoi cet article n\'est pas validé ?') || ''; }
    etat.motifPour = null; marquer(+b.dataset.m, 'non', motif);
  });
  f.querySelectorAll('[data-p]').forEach(b => b.onclick = async () => {
    if (!confirm('Retirer cette photo ?')) return;
    const d = await api('/livraison/api/photos/' + b.dataset.p, {method:'DELETE'}); garder(d.commande);
  });
  const go = (id, fn) => { const el = $('#' + id, f); if (el) el.onclick = fn; };
  go('a-prep', () => statut('preparee'));
  go('a-bat', () => statut('bateau'));
  go('a-livree', () => statut('livree'));
  go('a-arch', async () => { const d = await api('/livraison/api/commandes/' + c.id, {method:'PATCH', body: JSON.stringify({archive: !c.archive})}); toast(c.archive ? 'Commande ressortie' : 'Commande archivée'); fermer(); });
  go('bcopie', async () => { try { await navigator.clipboard.writeText(c.lien); toast('Lien copié ✓'); } catch(e) { prompt('Copie ce lien :', c.lien); } });
  go('bedit', modifier);
  f.querySelectorAll('[data-mail]').forEach(b => b.onclick = async () => {
    try { await api('/livraison/api/commandes/' + c.id + '/email', {method:'POST', body: JSON.stringify({type: b.dataset.mail})}); toast('✉️ Email en cours d\'envoi…'); setTimeout(() => ouvrir(c.id), 4000); }
    catch(err) { toast(err.message); }
  });
  go('bajt', async () => { const d = await api('/livraison/api/commandes/' + c.id, {method:'PATCH', body: JSON.stringify({ajouter: $('#ajt').value})}); garder(d.commande); });
  const fph = $('#fph', f);
  if (fph) fph.onchange = () => envoyerPhotos(fph.files);
}
function mailBloc(c, type) {
  if (!c.email) return `<p style="margin:0;color:var(--muted);font-size:13px">✉️ Pas d'email pour ce client — touche « Modifier » pour en ajouter un.</p>`;
  const j = (c.journal || []).find(x => x.type === 'email_ok' || x.type === 'email_err');
  const etatMail = j ? (j.type === 'email_ok' ? '✅ ' + esc(j.quoi) : '⚠️ ' + esc(j.quoi)) : (c.email_part ? '✉️ Email en cours d\'envoi à ' + esc(c.email) + '…' : '✉️ ' + esc(c.email));
  return `<div class="bloc" style="padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between"><span style="font-size:13px">${etatMail}</span><button class="chip" style="border:1px solid var(--ligne);background:var(--sable)" data-mail="${type}">Renvoyer</button></div>`;
}
function garder(c) { const m = etat.ouverte && etat.ouverte.messages; etat.ouverte = Object.assign(c, {messages: c.messages || m, wa_client: c.wa_client || (etat.ouverte && etat.ouverte.wa_client)}); rendreDetail(); }
async function marquer(id, e, motif) {
  try { const d = await api('/livraison/api/articles/' + id, {method:'POST', body: JSON.stringify({etat: e, motif})}); garder(d.commande); }
  catch(err) { toast(err.message); }
}
async function statut(s) {
  try {
    const d = await api('/livraison/api/commandes/' + etat.ouverte.id + '/statut', {method:'POST', body: JSON.stringify({statut: s})});
    etat.ouverte = d.commande; rendreDetail(s === 'preparee');
    if (d.commande.email_part) setTimeout(async () => { if (etat.ouverte && etat.ouverte.id === d.commande.id) { const o = await api('/livraison/api/commandes/' + d.commande.id); garder(o.commande); } }, 5000);
    if (s === 'preparee') toast('🎉 Commande préparée !', 'vert');
    if (s === 'bateau') toast('🚢 Déposée au bateau — envoie le lien au client', 'bleu');
    if (s === 'livree') toast('📦 Commande livrée');
  } catch(err) { toast(err.message); }
}
async function envoyerPhotos(files) {
  if (!files || !files.length) return;
  toast('Envoi de ' + files.length + ' photo(s)…');
  const fd = new FormData();
  for (const f of files) fd.append('photos', await reduire(f));
  try {
    const r = await fetch('/livraison/api/commandes/' + etat.ouverte.id + '/photos', {method:'POST', body: fd, credentials:'same-origin'});
    const d = await r.json(); if (!d.ok) throw new Error(d.message || 'Envoi impossible');
    garder(d.commande); toast(d.ajoutees + ' photo(s) ajoutée(s) ✓', 'bleu');
  } catch(err) { toast(err.message); }
}
function reduire(file) {
  return new Promise(res => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1800 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(u);
      cv.toBlob(b => res(b ? new File([b], 'photo.jpg', {type:'image/jpeg'}) : file), 'image/jpeg', 0.85);
    };
    img.onerror = () => res(file); img.src = u;
  });
}

/* ── formulaires ── */
function feuilleForm(titre, html, onok) {
  document.body.classList.add('ouvert');
  $('#feuille').innerHTML = `<div class="f-tete"><h2>${esc(titre)}</h2><button class="fermer" id="ff" aria-label="Fermer">×</button></div>
    <form class="f-corps form" id="ffm">${html}<div class="err" id="fe"></div><button class="gros" type="submit">Enregistrer</button></form>`;
  $('#ff').onclick = fermer;
  $('#ffm').onsubmit = async e => { e.preventDefault(); $('#fe').textContent = ''; try { await onok(); } catch(err) { $('#fe').textContent = err.message; } };
}
const v = id => ($('#' + id) || {}).value || '';
function champs(c={}) {
  return `<label class="ch">Nom du client *<input id="f-client" required value="${esc(c.client)}"></label>
    <div class="deux"><label class="ch">Téléphone (WhatsApp)<input id="f-tel" inputmode="tel" value="${esc(c.telephone)}" placeholder="87 12 34 56"></label>
    <label class="ch">Île / destination<input id="f-ile" value="${esc(c.ile)}" placeholder="Raiatea"></label></div>
    <label class="ch">Email du client (prévenu automatiquement)<input id="f-mail" type="email" inputmode="email" autocomplete="off" value="${esc(c.email)}" placeholder="client@exemple.com"></label>
    <div class="deux"><label class="ch">Bateau<input id="f-bat" value="${esc(c.bateau)}" placeholder="Hawaiki Nui"></label>
    <label class="ch">Départ<input id="f-dep" value="${esc(c.depart)}" placeholder="mardi 25/11"></label></div>
    <label class="ch">Référence (vide = automatique)<input id="f-ref" value="${esc(c.ref)}"></label>
    <label class="ch">Notes pour l'équipe<input id="f-notes" value="${esc(c.notes)}"></label>`;
}
function nouvelleCommande() {
  feuilleForm('Nouvelle commande', champs() + `
    <label class="ch">Articles * — une ligne par article. Tu peux coller ici la commande de la boutique.
      <textarea id="f-arts" required placeholder="2 x OHANA 75 · 4 séries 25 feuilles&#10;1 x Tampon 110 ml rose&#10;3 x LOVER 25 feuilles"></textarea></label>`,
    async () => {
      const d = await api('/livraison/api/commandes', {method:'POST', body: JSON.stringify({client: v('f-client'), telephone: v('f-tel'), email: v('f-mail'), ile: v('f-ile'), bateau: v('f-bat'), depart: v('f-dep'), ref: v('f-ref'), notes: v('f-notes'), articles: v('f-arts')})});
      toast('Commande ' + d.commande.ref + ' créée ✓', 'vert'); etat.onglet = 'afaire'; await charger(); ouvrir(d.commande.id);
    });
}
function modifier() {
  const c = etat.ouverte;
  feuilleForm('Modifier · ' + c.client, champs(c), async () => {
    await api('/livraison/api/commandes/' + c.id, {method:'PATCH', body: JSON.stringify({client: v('f-client'), telephone: v('f-tel'), email: v('f-mail'), ile: v('f-ile'), bateau: v('f-bat'), depart: v('f-dep'), ref: v('f-ref'), notes: v('f-notes')})});
    toast('Enregistré ✓'); ouvrir(c.id);
  });
}
function reglages() {
  feuilleForm('Réglages', `<label class="ch">Numéro WhatsApp de l'équipe (reçoit « commande préparée »)<input id="f-eq" inputmode="tel" value="${esc(etat.telEquipe)}" placeholder="89 22 23 05"></label>
    <p style="color:var(--muted);font-size:14px;margin:0">Connectée : <b>${esc(etat.moi)}</b>. <button type="button" class="chip" id="bdeco" style="border:1px solid var(--ligne);background:var(--papier)">Se déconnecter</button></p>`,
    async () => { await api('/livraison/api/reglages', {method:'POST', body: JSON.stringify({tel_equipe: v('f-eq')})}); etat.telEquipe = v('f-eq'); toast('Réglages enregistrés ✓'); fermer(); });
  $('#bdeco').onclick = async () => { await api('/livraison/api/deconnexion', {method:'POST'}); location.reload(); };
}

/* ── annonces en direct pour l'équipe ── */
function son() { try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.setValueAtTime(.15, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .5); o.start(); o.stop(a.currentTime + .5); } catch(e) {} }
async function veiller() {
  try {
    const d = await api('/livraison/api/flux?depuis=' + etat.dernier);
    if (etat.dernier) {
      const neufs = d.evenements.filter(e => e.qui !== etat.moi && ['preparee','bateau','creation','livree'].includes(e.type)).reverse();
      for (const e of neufs) {
        const t = ({preparee:'✅ Préparée', bateau:'🚢 Au bateau', creation:'🆕 Nouvelle commande', livree:'📦 Livrée'})[e.type] + ' · ' + e.client + (e.ile ? ' (' + e.ile + ')' : '') + ' — ' + e.qui;
        toast(t, e.type === 'bateau' ? 'bleu' : 'vert'); son();
        if ('vibrate' in navigator) navigator.vibrate(120);
        if ('Notification' in window && Notification.permission === 'granted' && document.hidden) { try { new Notification('Livraison numérique', {body: t}); } catch(err) {} }
      }
      if (neufs.length) { if (etat.ouverte) { const o = await api('/livraison/api/commandes/' + etat.ouverte.id); garder(o.commande); } await charger(); }
    }
    etat.dernier = d.dernier;
  } catch(e) {}
}
async function demarrer() { squelette(); await charger(); await veiller(); setInterval(veiller, 15000); }
(async () => { try { const d = await (await fetch('/livraison/api/moi', {credentials:'same-origin'})).json(); if (d.ok) { etat.moi = d.prenom; demarrer(); } else rendreConnexion(); } catch(e) { rendreConnexion(); } })();
</script>
