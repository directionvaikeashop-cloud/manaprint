<html lang="fr">

<meta charset="utf-8">

<title>MANAPRINT CALLER · Hors-ligne</title>
<link rel="manifest" href="/caller-local/manifest.json">
<meta name="theme-color" content="#0b1120">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0b1120; --panel: #1e293b; --panel2: #172033;
    --line: #334155; --muted: #94a3b8; --txt: #f1f5f9;
    --accent: #38bdf8; --green: #22c55e; --red: #ef4444; --amber: #f59e0b;
  }
  body { margin: 0 auto; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--txt); padding: 14px; max-width: 820px; }
  h1 { font-size: 1.15rem; text-align: center; margin: 4px 0 2px; letter-spacing: .02em; }
  .sub { text-align: center; color: var(--muted); font-size: .72rem; letter-spacing: .18em;
         text-transform: uppercase; margin-bottom: 6px; }
  .etat { text-align: center; font-size: .72rem; margin-bottom: 12px; color: var(--muted); }
  .etat b.ok { color: var(--green); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
          padding: 14px; margin-bottom: 12px; }
  select, button { font: inherit; border-radius: 12px; }
  select { width: 100%; padding: 10px 12px; background: var(--panel2); color: var(--txt);
           border: 1px solid var(--line); }
  .tirer { width: 100%; padding: 18px; font-size: 1.3rem; font-weight: 800; border: 0;
           background: var(--accent); color: #06263a; cursor: pointer; }
  .tirer:disabled { opacity: .4; }
  .boule-zone { text-align: center; padding: 8px 0 2px; }
  #boule-big { font-size: 4.6rem; font-weight: 900; line-height: 1; }
  #boule-lettre { color: var(--amber); font-weight: 700; letter-spacing: .1em; min-height: 1.2em; }
  .grille { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 10px; }
  .b { text-align: center; font-size: .78rem; padding: 5px 0; border-radius: 8px;
       background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
  .b.t { background: var(--accent); color: #06263a; font-weight: 800; border-color: var(--accent); }
  .ligne-btn { display: flex; gap: 8px; margin-top: 10px; }
  .ligne-btn button { flex: 1; padding: 10px; background: var(--panel2); color: var(--txt);
                      border: 1px solid var(--line); cursor: pointer; }
  .ligne-btn button.on { background: var(--green); color: #052e12; border-color: var(--green); font-weight: 800; }
  #btn-mystere { width: 100%; margin-top: 10px; padding: 12px; border: 1px solid var(--amber);
                 background: transparent; color: var(--amber); font-weight: 800; cursor: pointer; display: none; }
  #btn-mystere.pret { background: var(--amber); color: #3a2703; }
  #journal { max-height: 180px; overflow: auto; font-size: .8rem; color: var(--muted); }
  #journal div { padding: 2px 0; border-bottom: 1px dashed var(--line); }
  .pied { text-align: center; color: var(--muted); font-size: .68rem; margin-top: 14px; }
  .danger { color: var(--red); border-color: var(--red) !important; }
</style>
</head>
<body>
<h1>🎱 MANAPRINT CALLER</h1>
<div class="sub">Formule hors-ligne · le tirage vit dans l'appareil</div>
<div class="etat" id="etat">⏳ préparation du mode hors-ligne…</div>

<div class="card">
  <select id="jeu"></select>
  <div class="ligne-btn">
    <button onclick="nouvellePartie()">🆕 Nouvelle partie</button>
    <button onclick="basculerVoix(this)" id="btn-voix" class="on">🔊 Voix</button>
  </div>
</div>

<div class="card">
  <button class="tirer" id="btn-tirer" onclick="tirer()">TIRER 🎱</button>
  <div class="boule-zone">
    <div id="boule-big">—</div>
    <div id="boule-lettre"></div>
    <div style="color:var(--muted);font-size:.8rem" id="compteur"></div>
  </div>
  <div class="ligne-btn">
    <button onclick="basculerAuto(5,this)">⏱ 5 s</button>
    <button onclick="basculerAuto(8,this)">⏱ 8 s</button>
    <button onclick="basculerAuto(12,this)">⏱ 12 s</button>
  </div>
  <button id="btn-mystere" onclick="revelerMystere()">🔮 Révélation verrouillée</button>
  <div class="grille" id="grille"></div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <b style="font-size:.85rem">📜 Journal de la partie</b>
    <button style="padding:6px 10px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);cursor:pointer"
            onclick="exporterJournal()">⬇️ Exporter</button>
  </div>
  <div id="journal"></div>
</div>

<div class="pied">MANAPRINT · TUKEA IMPORT — Papeete · les boules naissent dans cet appareil,<br>
le journal s'exporte en fin de partie. Formule connectée : manaprint.app/caller</div>

  for (const p of pos) s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="9.5" fill="#444"/>';
  return s + '</g>';
}
function svgDe(n) {
  let corps, large;
  if (n <= 6) { corps = unDeSVG(n, 0); large = 110; }
  else { const d = DECOMP_DES[n]; corps = unDeSVG(d[0], -52) + unDeSVG(d[1], 52); large = 210; }
  return '<svg viewBox="' + (-large / 2) + ' -55 ' + large + ' 110" style="height:0.95em;vertical-align:-0.12em" xmlns="http://www.w3.org/2000/svg">' + corps + '</svg>';
}
function estBouleDe(jeu, n) { return CASINO_JEUX.indexOf(jeu) >= 0 && n >= 1 && n <= 9; }
function svgJoker() {
  return '<svg viewBox="-42 -55 84 110" style="height:0.95em;vertical-align:-0.12em" xmlns="http://www.w3.org/2000/svg">' +
    '<rect x="-38" y="-52" width="76" height="104" rx="10" fill="#fff" stroke="currentColor" stroke-width="6"/>' +
    '<polygon points="0,-38 6,-24 21,-24 9,-14 14,1 0,-8 -14,1 -9,-14 -21,-24 -6,-24" fill="#444"/>' +
    '<text x="0" y="22" text-anchor="middle" font-family="Helvetica,Arial" font-weight="bold" font-size="19" fill="#444">JO</text>' +
    '<text x="0" y="42" text-anchor="middle" font-family="Helvetica,Arial" font-weight="bold" font-size="19" fill="#444">KER</text></svg>';
}
function afficherGrosseBoule(el, jeu, n) {
  if (n === 300) el.innerHTML = svgJoker();
  else if (estBouleDe(jeu, n)) el.innerHTML = svgDe(n);
  else el.textContent = nomBoule(n);
}
function nomBoule(n) {
  if (n === 300) return "JOKER";
  if (n >= 201) return MONTANTS_AFF[n - 201];
  return n > 100 ? String.fromCharCode(64 + n - 100) : n;
}

function hasardParmi(liste) {
  // le hasard du navigateur, qualité crypto — personne ne choisit
  const buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  return liste[buf[0] % liste.length];
}

function sauver() { try { localStorage.setItem("mpcl_partie", JSON.stringify(P)); } catch (e) {} }

function charger() {
  try { P = JSON.parse(localStorage.getItem("mpcl_partie") || "null"); } catch (e) { P = null; }
  if (P && !JEUX[P.jeu]) P = null;
}

function nouvellePartie() {
  const jeu = document.getElementById("jeu").value;
  P = { jeu: jeu, tirees: [], journal: [], mysteres: null,
        debut: new Date().toISOString() };
  sauver(); maj();
}

function lettrePour(n) {
  const j = JEUX[P.jeu];
  if (!j.lettres || j.max !== 75) return "";
  return j.lettres[Math.floor((n - 1) / 15)] || "";
}

function parlerBoule(n, texte) {
  if (!voixActive) return;
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texte || nombreEnLettres(n));
    u.lang = "fr-FR"; u.rate = 0.85; u.pitch = 1.0; u.volume = 1.0;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function tirer() {
  if (!P) nouvellePartie();
  const sac = sacDe(P.jeu).filter(n => !P.tirees.includes(n));
  if (!sac.length) { arreterAuto(); alert("Toutes les boules sont sorties !"); return; }
  const n = hasardParmi(sac);
  P.tirees.push(n);
  P.journal.push({ b: n, h: new Date().toISOString() });
  sauver();
  afficherGrosseBoule(document.getElementById("boule-big"), P.jeu, n);
  document.getElementById("boule-lettre").textContent = n > 100 ? "🅰️ LETTRE DE LA SALLE" : lettrePour(n);
  parlerBoule(n, n === 300 ? "Le Joker ! Cochez une carte de votre choix !" : (n >= 201 ? MONTANTS_VOIX[n - 201] + " !" : (n > 100 ? "La lettre... " + nomBoule(n) + " !" : null)));
  maj();
}

// ── 🔮 la triple révélation locale : mêmes garde-fous qu'en ligne ──
function seuilMystere() { return Math.floor(sacDe(P.jeu).length / 4); }

function revelerMystere() {
  if (!P || P.mysteres) return;
  if (P.tirees.length < seuilMystere()) return;
  const cols = MYSTERE_COLONNES[P.jeu] || [];
  const m = {}; const morceaux = [];
  cols.forEach(function (c, k) {
    const [L, a, b] = c;
    const dispo = [];
    for (let n = a; n <= b; n++) if (!P.tirees.includes(n)) dispo.push(n);
    if (!dispo.length) { m[L] = null; morceaux.push(L + " épuisée"); return; }
    const n = hasardParmi(dispo);
    m[L] = n;
    P.tirees.push(n);
    P.journal.push({ b: n, h: new Date().toISOString(), mystere: L });
    morceaux.push(L + " " + n);
    setTimeout(function () {
      document.getElementById("boule-big").textContent = n;
      document.getElementById("boule-lettre").textContent = "🔮 " + L;
      parlerBoule(n);
      maj();
    }, 2600 * k);
  });
  P.mysteres = morceaux.join(" · ");
  sauver(); maj();
}

function basculerAuto(s, btn) {
  if (autoTimer && autoSecondes === s) { arreterAuto(); return; }
  arreterAuto();
  autoSecondes = s;
  tirer();
  autoTimer = setInterval(tirer, s * 1000);
  document.querySelectorAll(".ligne-btn button").forEach(b => { if (b.textContent.includes("⏱")) b.classList.remove("on"); });
  if (btn) btn.classList.add("on");
}

function arreterAuto() {
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = null; autoSecondes = 0;
  document.querySelectorAll(".ligne-btn button").forEach(b => { if (b.textContent.includes("⏱")) b.classList.remove("on"); });
}

function basculerVoix(btn) { voixActive = !voixActive; btn.classList.toggle("on", voixActive); }

function exporterJournal() {
  if (!P || !P.journal.length) { alert("Le journal est vide."); return; }
  let txt = "MANAPRINT CALLER HORS-LIGNE\nJeu;" + (JEUX[P.jeu] ? JEUX[P.jeu].nom : P.jeu)
          + "\nDébut;" + P.debut + "\n\nN°;Boule;Heure;Mystère\n";
  P.journal.forEach(function (e, i) {
    txt += (i + 1) + ";" + nomBoule(e.b) + ";" + e.h + ";" + (e.mystere || "") + "\n";
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" }));
  a.download = "journal_caller_" + (P.debut || "").slice(0, 10) + ".csv";
  a.click();
}

function maj() {
  if (!P) return;
  document.getElementById("jeu").value = P.jeu;
  const sac = sacDe(P.jeu);
  document.getElementById("compteur").textContent = P.tirees.length + " / " + sac.length + " boules";
  // la grille
  const g = document.getElementById("grille");
  g.innerHTML = "";
  sac.forEach(function (n) {
    const d = document.createElement("div");
    d.className = "b" + (P.tirees.includes(n) ? " t" : "");
    d.textContent = nomBoule(n);
    g.appendChild(d);
  });
  // le journal (dernières boules d'abord)
  const j = document.getElementById("journal");
  j.innerHTML = "";
  P.journal.slice().reverse().forEach(function (e, i) {
    const d = document.createElement("div");
    const h = (e.h || "").slice(11, 19);
    d.textContent = "#" + (P.journal.length - i) + "  " + (e.b >= 201 ? "💰 MONTANT " + nomBoule(e.b) : e.b > 100 ? "🅰️ LETTRE " + nomBoule(e.b) : (e.mystere ? "🔮 " + e.mystere + " boule " + e.b : "boule " + e.b)) + "  ·  " + h;
    j.appendChild(d);
  });
  // le mystère
  const bm = document.getElementById("btn-mystere");
  if (MYSTERE_JEUX.includes(P.jeu)) {
    bm.style.display = "block";
    if (P.mysteres) { bm.disabled = true; bm.classList.remove("pret");
      bm.textContent = "🔮 MYSTÈRES RÉVÉLÉS — " + P.mysteres; }
    else if (P.tirees.length >= seuilMystere()) { bm.disabled = false; bm.classList.add("pret");
      bm.textContent = "🔮 RÉVÉLER LES N° MYSTÈRE (B·I·O)"; }
    else { bm.disabled = true; bm.classList.remove("pret");
      bm.textContent = "🔮 Révélation verrouillée — à la " + seuilMystere() + "e boule (" + P.tirees.length + "/" + seuilMystere() + ")"; }
  } else { bm.style.display = "none"; }
}

// ── le menu des jeux ──
(function () {
  const sel = document.getElementById("jeu");
  Object.keys(JEUX).forEach(function (k) {
    const o = document.createElement("option");
    o.value = k; o.textContent = JEUX[k].nom;
    sel.appendChild(o);
  });
  sel.onchange = nouvellePartie;
  charger();
  if (!P) nouvellePartie(); else maj();
})();

// ── le mode hors-ligne : la page s'installe dans l'appareil ──
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/caller-local/sw.js").then(function () {
    document.getElementById("etat").innerHTML =
      "<b class=ok>📴 HORS-LIGNE PRÊT</b> — cette page fonctionne désormais sans internet sur cet appareil.";
  }).catch(function () {
    document.getElementById("etat").textContent = "⚠️ mode hors-ligne non installé (navigateur trop ancien) — la page reste utilisable.";
  });
}
